server:
  port: 7074
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application:
    name: shop-order
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:3306/eastern_market?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 支付宝沙箱配置（公钥模式）
# 沙箱地址：https://open.alipay.com/develop/sandbox/app
# 在沙箱页面获取 AppID、应用私钥、支付宝公钥，通过环境变量注入（见 .env）
alipay:
  app-id: ${ALIPAY_APP_ID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  public-key: ${ALIPAY_PUBLIC_KEY:}
  gateway: https://openapi.alipaydev.com/gateway.do
  # 异步通知地址：需公网可访问（本地开发用内网穿透工具如 cpolar/ngrok 暴露 7074 端口）
  notify-url: ${ALIPAY_NOTIFY_URL:}
  # 同步跳转地址：支付完成后浏览器跳回前端页面（与 vite.config.js server.port 保持一致）
  return-url: ${ALIPAY_RETURN_URL:http://localhost:1160/pay-result}
  sign-type: RSA2
