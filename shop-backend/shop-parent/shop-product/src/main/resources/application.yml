server:
  port: 7073
spring:
  application:
    name: shop-product
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/buka_shop
    username: root
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# 七牛云对象存储配置
# 凭证请勿硬编码：通过环境变量 QINIU_AK / QINIU_SK 注入
# 获取方式：七牛云控制台 -> 密钥管理（AK/SK） + 对象存储 -> 新建空间（bucket） + 绑定域名（domain）
qiniu:
  access-key: ${QINIU_AK:}
  secret-key: ${QINIU_SK:}
  bucket: ${QINIU_BUCKET:}
  # 访问域名，如 https://cdn.example.com，末尾不带斜杠
  domain: ${QINIU_DOMAIN:http://替换为你的七牛域名}
  # 存储区域：auto=自动 / region0=华东 / region1=华北 / region2=华南
  region: auto

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
