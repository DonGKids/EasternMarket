server:
  port: 7071
spring:
  application:
    name: shop-user
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        import-check:
          enabled: false
  datasource:
     driver-class-name: com.mysql.cj.jdbc.Driver

     url: "jdbc:mysql://${MYSQL_HOST:localhost}:3306/eastern_market?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true"
     username: root
     password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
  mail:
    host: smtp.qq.com
    port: 465
    # 从环境变量注入（见 .env）：QQ 邮箱地址 + 授权码
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 50MB

# 头像上传配置
app:
  upload:
    avatar-dir: ${AVATAR_DIR:D:/easternmarket-files/avatars}
    avatar-url: /avatars

# 优惠券配置
coupon:
  # 新人券模板ID（注册成功后自动发放，需与 coupon_template 表的 id 对应）
  new-user-template-id: 1

# 七牛云对象存储配置
# 凭证请勿硬编码：通过环境变量 QINIU_AK / QINIU_SK 注入（见 .env）
# 获取方式：七牛云控制台 -> 密钥管理（AK/SK） + 对象存储 -> 新建空间（bucket） + 绑定域名（domain）
qiniu:
  access-key: ${QINIU_AK:}
  secret-key: ${QINIU_SK:}
  bucket: ${QINIU_BUCKET:bukashop11}
  # 访问域名，如 https://cdn.example.com，末尾不带斜杠
  domain: ${QINIU_DOMAIN:http://tk1vwjpkf.hn-bkt.clouddn.com}
  # 存储区域：auto=自动 / region0=华东 / region1=华北 / region2=华南
  region: region2

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
